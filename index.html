<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Amiguito Pro — aventure-se no espaço com a astronauta, amiguinhos e trilhas de matemática, ciência, inglês e tecnologia. byGui">
  <meta name="theme-color" content="#5B4B8A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Amiguito Pro">
  <title>Amiguito Pro · Espaço · byGui</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <div id="app" class="app">
    <header class="topo" role="banner">
      <div class="topo__marca">
        <img class="topo__avatar" src="img/astronauta-guia.png" width="40" height="40" alt="" aria-hidden="true">
        <div>
          <h1 class="topo__titulo">Amiguito Pro</h1>
          <p class="topo__selo" id="topo-selo">Missão Espacial · Aprender</p>
        </div>
      </div>
      <div class="topo__acoes">
        <span id="streak-badge" class="streak" hidden title="Dias seguidos"></span>
        <button type="button" id="btn-som" class="btn btn--icone" aria-pressed="false" aria-label="Ativar sons" title="Sons">
          <span aria-hidden="true">🔇</span>
        </button>
      </div>
    </header>

    <main id="conteudo" class="conteudo" tabindex="-1"></main>

    <nav id="nav-principal" class="nav" hidden aria-label="Menu principal">
      <a href="#/casa" class="nav__item" data-rota="casa"><span class="nav__icone" aria-hidden="true">🏠</span><span>Base</span></a>
      <a href="#/brincar" class="nav__item" data-rota="brincar"><span class="nav__icone" aria-hidden="true">🎮</span><span>Brincar</span></a>
      <a href="#/stem" class="nav__item" data-rota="stem"><span class="nav__icone" aria-hidden="true">🚀</span><span>Missões</span></a>
      <a href="#/mais" class="nav__item" data-rota="mais"><span class="nav__icone" aria-hidden="true">✨</span><span>Mais</span></a>
    </nav>

    <footer class="rodape"><p>Feito com carinho · <strong>byGui</strong></p></footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="confete" class="confete" aria-hidden="true"></div>

  <script src="js/storage.js" defer></script>
  <script src="js/som.js" defer></script>
  <script src="js/ia.js" defer></script>
  <script src="js/pet.js" defer></script>
  <script src="js/ensinar.js" defer></script>
  <script src="js/aprender.js" defer></script>
  <script src="js/jogos.js" defer></script>
  <script src="js/yoga.js" defer></script>
  <script src="js/roteiros.js" defer></script>
  <script src="js/stem.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
